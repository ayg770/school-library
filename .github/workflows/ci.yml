name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Electron's own binary is a 100 MB download that nothing here needs:
      # the checks below never launch it.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
